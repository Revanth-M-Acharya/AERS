# ==============================================================================
# SMART AEGIS (AERS) — Emergency Control Center Configuration
# Target: Raspberry Pi 4 Model B (QNX Neutrino RTOS 8.0 / POSIX)
# ==============================================================================

# Priority Evaluation Weights (Must sum to 1.0 or normalized internally)
WeightEmergencyType=0.35
WeightPatientSeverity=0.35
WeightDistanceEta=0.15
WeightHospitalCapability=0.15

# Timeouts in milliseconds
DispatchTimeoutMs=5000
DoctorPrepTimeoutMs=600000
HandoverTimeoutMs=1800000
SessionWatchdogMs=3600000

# Retries and Queue Sizes
MaxAllocationRetries=3
MaxRerouteAttempts=3
MaxConcurrentEmergencies=64
MaxIncidentHistory=512

# Validation Thresholds
MaxResponseDistanceKm=50.0
MinPatientAgeYears=0
MaxPatientAgeYears=125
RequireExactCoordinates=false
AutoEscalatePendingSec=300

