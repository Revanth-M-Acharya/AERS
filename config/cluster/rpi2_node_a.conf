# ==============================================================================
# SMART AEGIS - RPi 2 Traffic Node A Configuration
# Target: Raspberry Pi 4 Model B / QNX SDP 8.0 (192.168.1.101:9001)
# Controls: 4-Channel Relay Bank + Dual-Road Signals + Optical IR Sensor
# ==============================================================================
nodeId=INT_A
role=TRAFFIC_NODE
ipAddress=192.168.1.101
listenPort=9001
coordinatorIp=192.168.1.100
coordinatorPort=9000

heartbeatIntervalMs=1000
connectTimeoutMs=3000
ackTimeoutMs=3000
watchdogTimeoutMs=5000

# Symbolic GPIO Pin Mappings (Format: pin.<SIGNAL>=<BCM_PIN>,<DIRECTION>,<POLARITY>,<DESCRIPTION>)
pin.ROAD_A_RED=17,OUTPUT,ACTIVE_LOW,Relay Ch 1 (Road A Red Lamp)
pin.ROAD_A_YELLOW=27,OUTPUT,ACTIVE_LOW,Relay Ch 2 (Road A Yellow Lamp)
pin.ROAD_A_GREEN=22,OUTPUT,ACTIVE_LOW,Relay Ch 3 (Road A Green Lamp)
pin.ROAD_B_RED=23,OUTPUT,ACTIVE_HIGH,Direct Drive (Road B Red Lamp)
pin.ROAD_B_YELLOW=24,OUTPUT,ACTIVE_HIGH,Direct Drive (Road B Yellow Lamp)
pin.ROAD_B_GREEN=25,OUTPUT,ACTIVE_LOW,Relay Ch 4 (Road B Green Lamp)
pin.PEDESTRIAN_WALK=5,OUTPUT,ACTIVE_HIGH,Direct Drive (Pedestrian Walk LED)
pin.EMERGENCY_STROBE=26,OUTPUT,ACTIVE_HIGH,Direct Drive (Optical Emergency Strobe LED)
pin.ACOUSTIC_BUZZER=6,OUTPUT,ACTIVE_HIGH,Direct Drive (Acoustic Preemption Buzzer)
pin.APPROACH_IR_SENSOR=12,INPUT,ACTIVE_LOW,Digital Input (Active Optical Approach IR Sensor)
pin.DEPARTURE_IR_SENSOR=13,INPUT,ACTIVE_LOW,Digital Input (Active Optical Departure IR Sensor)
