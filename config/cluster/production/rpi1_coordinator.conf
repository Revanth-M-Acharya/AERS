# ==============================================================================
# SMART AEGIS - Phase 15 Production Hardware Configuration
# Node: Raspberry Pi 1 (Emergency Coordinator & Command Center Node)
# Target OS: QNX Neutrino RTOS 8.0 Starter Kit (aarch64le)
# Approved BCM & Physical Pin Assignments
# ==============================================================================

# Node Identity & Network Configuration
nodeId=RPI_COORD
role=COORDINATOR
ipAddress=192.168.1.100
listenPort=9000
coordinatorIp=192.168.1.100
coordinatorPort=9000

heartbeatIntervalMs=1000
connectTimeoutMs=3000
ackTimeoutMs=3000
watchdogTimeoutMs=5000

# ==============================================================================
# APPROVED BCM GPIO ASSIGNMENTS
# Format: pin.<SYMBOLIC_NAME>=<BCM_PIN>,<DIRECTION>,<POLARITY>,<DESCRIPTION>
# ==============================================================================

# Emergency Mission Trigger Push Button (HOME Station)
# Physical Header Pin: 16 | Logic: 3.3V Active-Low (Internal Pull-Up)
pin.EMERGENCY_SWITCH=23,INPUT,ACTIVE_LOW,Emergency Mission Trigger Switch near HOME
pin.HOME_EMERGENCY_SWITCH=23,INPUT,ACTIVE_LOW,Emergency Mission Trigger Switch near HOME

# Police Verified Road Incident Advisory Switch (Dynamic Detour Trigger)
# Physical Header Pin: 18 | Logic: 3.3V Active-Low (Internal Pull-Up)
pin.POLICE_OVERRIDE_SWITCH=24,INPUT,ACTIVE_LOW,Police Barricade / Road Closed Switch

# Acoustic Preemption Transducer (5 Demonstration Rhythm Patterns)
# Physical Header Pin: 31 | Logic: 3.3V Active-High (2N2222 Transistor Driver)
pin.COORDINATOR_BUZZER=6,OUTPUT,ACTIVE_HIGH,Acoustic Preemption Buzzer at HOME
pin.HOME_BUZZER=6,OUTPUT,ACTIVE_HIGH,Acoustic Preemption Buzzer at HOME

# Coordinator Microkernel Liveness Heartbeat LED
# Physical Header Pin: 12 | Logic: 3.3V Active-High (330 Ohm Current Limiter)
pin.STATUS_LED=18,OUTPUT,ACTIVE_HIGH,Coordinator Heartbeat/Status LED
pin.COORDINATOR_STATUS_LED=18,OUTPUT,ACTIVE_HIGH,Coordinator Heartbeat/Status LED

# Vehicle-to-Everything (V2X) 0.96 inch SSD1306 OLED Display
# Hardware I2C-1 Bus | Address: 0x3C | Speed: 400 kHz Fast-Mode
# SDA: BCM GPIO 2 (Physical Header Pin 3)
# SCL: BCM GPIO 3 (Physical Header Pin 5)
# Power: +3.3V DC (Header Pin 1), Ground (Header Pin 9)
