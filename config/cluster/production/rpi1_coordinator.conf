# ==============================================================================
# SMART AEGIS - Prototype Hardware Configuration
# Node: Raspberry Pi 1 (Emergency Coordinator & Command Center Node)
# Target OS: QNX Neutrino RTOS 8.0 Starter Kit (aarch64le)
# Hardware Specification: ZERO LEDs connected (Pure Coordinator & TCP Engine)
# ==============================================================================

# Node Identity & Network Configuration
nodeId=RPI_COORD
role=COORDINATOR
ipAddress=192.168.1.100
listenPort=9000
coordinatorIp=192.168.1.100
coordinatorPort=9000

heartbeatIntervalMs=1000
connectTimeoutMs=3000
ackTimeoutMs=3000
watchdogTimeoutMs=5000

# ==============================================================================
# APPROVED BCM GPIO ASSIGNMENTS (COORDINATOR - NO LEDS CONNECTED)
# Performs only Coordinator functionality; handles TCP/IP communication with
# all intersection Raspberry Pis.
# ==============================================================================

# Emergency Mission Trigger Push Button (HOME Station)
# Physical Header Pin: 16 | Logic: 3.3V Active-Low (Internal Pull-Up)
pin.EMERGENCY_SWITCH=23,INPUT,ACTIVE_LOW,Emergency Mission Trigger Switch near HOME
pin.HOME_EMERGENCY_SWITCH=23,INPUT,ACTIVE_LOW,Emergency Mission Trigger Switch near HOME

# Police Verified Road Incident Advisory Switch (Dynamic Detour Trigger)
# Physical Header Pin: 18 | Logic: 3.3V Active-Low (Internal Pull-Up)
pin.POLICE_OVERRIDE_SWITCH=24,INPUT,ACTIVE_LOW,Police Barricade / Road Closed Switch
