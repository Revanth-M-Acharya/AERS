# ==============================================================================
# SMART AEGIS - Phase 15 Production Hardware Configuration
# Node: Raspberry Pi 4 (Traffic Node 3 - Intersection 3: Hospital Terminal Access)
# Target OS: QNX Neutrino RTOS 8.0 Starter Kit (aarch64le)
# Approved BCM & Physical Pin Assignments
# ==============================================================================

# Node Identity & Network Configuration
nodeId=INT_3
role=TRAFFIC_NODE
ipAddress=192.168.1.103
listenPort=9003
coordinatorIp=192.168.1.100
coordinatorPort=9000

heartbeatIntervalMs=1000
connectTimeoutMs=3000
ackTimeoutMs=3000
watchdogTimeoutMs=5000

# ==============================================================================
# APPROVED BCM GPIO ASSIGNMENTS (INTERSECTION 3 - HOSPITAL APPROACH)
# Controls: 4-Channel Optocoupled Relay Board + Dual Traffic Light Modules
# ==============================================================================

# Road A Traffic Signals (Hospital Inbound Direct Approach)
# Relay K1: Road A Red Lamp | Header Pin: 11
pin.INT3_ROAD_A_RED=17,OUTPUT,ACTIVE_LOW,Relay Ch 1 (Road A Red Lamp)
pin.ROAD_A_RED=17,OUTPUT,ACTIVE_LOW,Relay Ch 1 (Road A Red Lamp)

# Relay K2: Road A Yellow Lamp | Header Pin: 13
pin.INT3_ROAD_A_YELLOW=27,OUTPUT,ACTIVE_LOW,Relay Ch 2 (Road A Yellow Lamp)
pin.ROAD_A_YELLOW=27,OUTPUT,ACTIVE_LOW,Relay Ch 2 (Road A Yellow Lamp)

# Relay K3: Road A Green Lamp (Hospital Emergency Access) | Header Pin: 15
pin.INT3_ROAD_A_GREEN=22,OUTPUT,ACTIVE_LOW,Relay Ch 3 (Road A Green Lamp)
pin.ROAD_A_GREEN=22,OUTPUT,ACTIVE_LOW,Relay Ch 3 (Road A Green Lamp)

# Road B Traffic Signals (Hospital Perimeter Cross Traffic)
# Road B Red Lamp | Header Pin: 16 | Interlocked via Relay K3 NC or Direct Driver
pin.INT3_ROAD_B_RED=23,OUTPUT,ACTIVE_HIGH,Direct Drive / Interlock (Road B Red Lamp)
pin.ROAD_B_RED=23,OUTPUT,ACTIVE_HIGH,Direct Drive / Interlock (Road B Red Lamp)

# Road B Yellow Lamp | Header Pin: 18 | Direct Driver / Expansion
pin.INT3_ROAD_B_YELLOW=24,OUTPUT,ACTIVE_HIGH,Direct Drive / Expansion (Road B Yellow Lamp)
pin.ROAD_B_YELLOW=24,OUTPUT,ACTIVE_HIGH,Direct Drive / Expansion (Road B Yellow Lamp)

# Relay K4: Road B Green Lamp | Header Pin: 22
pin.INT3_ROAD_B_GREEN=25,OUTPUT,ACTIVE_LOW,Relay Ch 4 (Road B Green Lamp)
pin.ROAD_B_GREEN=25,OUTPUT,ACTIVE_LOW,Relay Ch 4 (Road B Green Lamp)

# Vehicle Detection Optical IR Sensor (Hospital Arrival Sensor)
# LM393 Optical Comparator | Header Pin: 32 | Logic: 3.3V Active-Low (30ms Debounce)
pin.INT3_APPROACH_IR=12,INPUT,ACTIVE_LOW,Active Optical Approach IR Sensor
pin.APPROACH_IR_SENSOR=12,INPUT,ACTIVE_LOW,Active Optical Approach IR Sensor
