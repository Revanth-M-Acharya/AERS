# ==============================================================================
# SMART AEGIS - Prototype Hardware Configuration
# Node: Raspberry Pi 4 (Traffic Node 3 - Intersection 3)
# Target OS: QNX Neutrino RTOS 8.0 Starter Kit (aarch64le)
# Hardware Specification: Direct GPIO LED Control - ONE LED ONLY (Hardware Shortage)
# ==============================================================================

# Node Identity & Network Configuration
nodeId=INT_3
role=TRAFFIC_NODE
ipAddress=192.168.1.103
listenPort=9003
coordinatorIp=192.168.1.100
coordinatorPort=9000

heartbeatIntervalMs=1000
connectTimeoutMs=3000
ackTimeoutMs=3000
watchdogTimeoutMs=5000

# ==============================================================================
# APPROVED BCM GPIO ASSIGNMENTS (INTERSECTION 3 - EXACTLY ONE LED: BLUE ONLY)
# Due to prototype hardware shortage, Intersection 3 has NO Red LED.
# Direct Raspberry Pi GPIO Control (3.3V Logic, Active-High, 330 Ohm Resistors)
# ==============================================================================

# Blue Emergency Corridor LED (Green Wave / Corridor Granted Indicator)
# BCM GPIO 6 | Physical Header Pin 31 | Logic: Active-High
pin.LED_BLUE=6,OUTPUT,ACTIVE_HIGH,Intersection 3 Blue Emergency Corridor LED (Pin 31)

# Vehicle Detection Optical IR Sensor (Hospital Access Approach Sensor)
# LM393 Optical Comparator | BCM GPIO 12 | Physical Header Pin 32 | Active-Low (30ms Debounce)
pin.APPROACH_IR_SENSOR=12,INPUT,ACTIVE_LOW,Active Optical Approach IR Sensor (Pin 32)
pin.INT3_APPROACH_IR=12,INPUT,ACTIVE_LOW,Active Optical Approach IR Sensor (Pin 32)
