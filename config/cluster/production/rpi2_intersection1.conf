# ==============================================================================
# SMART AEGIS - Prototype Hardware Configuration
# Node: Raspberry Pi 2 (Traffic Node 1 - Intersection 1)
# Target OS: QNX Neutrino RTOS 8.0 Starter Kit (aarch64le)
# Hardware Specification: Direct GPIO LED Control (No Relays / No Traffic Modules)
# ==============================================================================

# Node Identity & Network Configuration
nodeId=INT_1
role=TRAFFIC_NODE
ipAddress=192.168.1.101
listenPort=9001
coordinatorIp=192.168.1.100
coordinatorPort=9000

heartbeatIntervalMs=1000
connectTimeoutMs=3000
ackTimeoutMs=3000
watchdogTimeoutMs=5000

# ==============================================================================
# APPROVED BCM GPIO ASSIGNMENTS (INTERSECTION 1 - EXACTLY TWO LEDS)
# Direct Raspberry Pi GPIO Control (3.3V Logic, Active-High, 330 Ohm Resistors)
# ==============================================================================

# Red Stop LED (Stop / Hold Traffic Indicator)
# BCM GPIO 5 | Physical Header Pin 29 | Logic: Active-High
pin.LED_RED=5,OUTPUT,ACTIVE_HIGH,Intersection 1 Red Stop LED (Pin 29)

# Blue Emergency Corridor LED (Green Wave / Corridor Granted Indicator)
# BCM GPIO 6 | Physical Header Pin 31 | Logic: Active-High
pin.LED_BLUE=6,OUTPUT,ACTIVE_HIGH,Intersection 1 Blue Emergency Corridor LED (Pin 31)

# Vehicle Detection Optical IR Sensor (Road Approach Sensor)
# LM393 Optical Comparator | BCM GPIO 12 | Physical Header Pin 32 | Active-Low (30ms Debounce)
pin.APPROACH_IR_SENSOR=12,INPUT,ACTIVE_LOW,Active Optical Approach IR Sensor (Pin 32)
pin.INT1_APPROACH_IR=12,INPUT,ACTIVE_LOW,Active Optical Approach IR Sensor (Pin 32)
