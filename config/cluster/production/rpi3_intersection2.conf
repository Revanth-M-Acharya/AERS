# ==============================================================================
# SMART AEGIS - Phase 15 Production Hardware Configuration
# Node: Raspberry Pi 3 (Traffic Node 2 - Intersection 2: Priority Scheduling Hub)
# Target OS: QNX Neutrino RTOS 8.0 Starter Kit (aarch64le)
# Approved BCM & Physical Pin Assignments
# ==============================================================================

# Node Identity & Network Configuration
nodeId=INT_2
role=TRAFFIC_NODE
ipAddress=192.168.1.102
listenPort=9002
coordinatorIp=192.168.1.100
coordinatorPort=9000

heartbeatIntervalMs=1000
connectTimeoutMs=3000
ackTimeoutMs=3000
watchdogTimeoutMs=5000

# ==============================================================================
# APPROVED BCM GPIO ASSIGNMENTS (INTERSECTION 2 - PRIORITY HUB)
# Controls: 4-Channel Optocoupled Relay Board + Dual Traffic Lights + Dual IR Sensors
# ==============================================================================

# Road A Traffic Signals (Top Approach - Primary Corridor Flow)
# Relay K1: Road A Red Lamp | Header Pin: 11
pin.INT2_ROAD_A_RED=17,OUTPUT,ACTIVE_LOW,Relay Ch 1 (Road A Red Lamp)
pin.ROAD_A_RED=17,OUTPUT,ACTIVE_LOW,Relay Ch 1 (Road A Red Lamp)

# Relay K2: Road A Yellow Lamp | Header Pin: 13
pin.INT2_ROAD_A_YELLOW=27,OUTPUT,ACTIVE_LOW,Relay Ch 2 (Road A Yellow Lamp)
pin.ROAD_A_YELLOW=27,OUTPUT,ACTIVE_LOW,Relay Ch 2 (Road A Yellow Lamp)

# Relay K3: Road A Green Lamp (Code Red Preemption) | Header Pin: 15
pin.INT2_ROAD_A_GREEN=22,OUTPUT,ACTIVE_LOW,Relay Ch 3 (Road A Green Lamp)
pin.ROAD_A_GREEN=22,OUTPUT,ACTIVE_LOW,Relay Ch 3 (Road A Green Lamp)

# Road B Traffic Signals (Right Approach - Conflicting Flow)
# Road B Red Lamp | Header Pin: 16 | Interlocked via Relay K3 NC or Direct Driver
pin.INT2_ROAD_B_RED=23,OUTPUT,ACTIVE_HIGH,Direct Drive / Interlock (Road B Red Lamp)
pin.ROAD_B_RED=23,OUTPUT,ACTIVE_HIGH,Direct Drive / Interlock (Road B Red Lamp)

# Road B Yellow Lamp | Header Pin: 18 | Direct Driver / Expansion
pin.INT2_ROAD_B_YELLOW=24,OUTPUT,ACTIVE_HIGH,Direct Drive / Expansion (Road B Yellow Lamp)
pin.ROAD_B_YELLOW=24,OUTPUT,ACTIVE_HIGH,Direct Drive / Expansion (Road B Yellow Lamp)

# Relay K4: Road B Green Lamp (Code Yellow Secondary) | Header Pin: 22
pin.INT2_ROAD_B_GREEN=25,OUTPUT,ACTIVE_LOW,Relay Ch 4 (Road B Green Lamp)
pin.ROAD_B_GREEN=25,OUTPUT,ACTIVE_LOW,Relay Ch 4 (Road B Green Lamp)

# Dual Optical Vehicle Approach Sensors for Priority Scheduling Demonstration
# Approach A (Top Approach - Primary Ambulance AMB_01): Header Pin: 32 | BCM 12
pin.INT2_APPROACH_IR_TOP=12,INPUT,ACTIVE_LOW,Optical IR Sensor Approach A (Top)
pin.APPROACH_IR_SENSOR=12,INPUT,ACTIVE_LOW,Optical IR Sensor Approach A (Top)

# Approach B (Right Approach - Conflicting Ambulance AMB_02): Header Pin: 33 | BCM 13
pin.INT2_APPROACH_IR_RIGHT=13,INPUT,ACTIVE_LOW,Optical IR Sensor Approach B (Right)
pin.DEPARTURE_IR_SENSOR=13,INPUT,ACTIVE_LOW,Optical IR Sensor Approach B (Right)
