signal.INT2_ROAD_B_GREEN.description=Intersection 2 Road B Green Lamp (Relay K4)

# --- Dual Vehicle Detection IR Sensors (Priority Arbitration Demonstration) ---

# Symbolic Signal: INT2_IR_SENSOR_TOP
# Purpose: Optical vehicle approach detection on Approach A (Top / Code Red Priority)
# Direction: INPUT | Polarity: ACTIVE_LOW (Debounce window: 30ms)
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.INT2_IR_SENSOR_TOP.direction=INPUT
signal.INT2_IR_SENSOR_TOP.polarity=ACTIVE_LOW
signal.INT2_IR_SENSOR_TOP.allocation=RESERVED_PENDING_APPROVAL
signal.INT2_IR_SENSOR_TOP.description=Intersection 2 Approach A Top IR Proximity Sensor

# Symbolic Signal: INT2_IR_SENSOR_RIGHT
# Purpose: Optical vehicle approach detection on Approach B (Right / Code Yellow Secondary)
# Direction: INPUT | Polarity: ACTIVE_LOW (Debounce window: 30ms)
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.INT2_IR_SENSOR_RIGHT.direction=INPUT
signal.INT2_IR_SENSOR_RIGHT.polarity=ACTIVE_LOW
signal.INT2_IR_SENSOR_RIGHT.allocation=RESERVED_PENDING_APPROVAL
signal.INT2_IR_SENSOR_RIGHT.description=Intersection 2 Approach B Right IR Proximity Sensor
