# ==============================================================================
# SMART AEGIS - Phase 14 Hardware Configuration Template (SYMBOLIC RESERVATION)
# Node: Raspberry Pi 3 (Traffic Node 2 - Intersection 2: Priority Scheduling Hub)
# OS Target: QNX Neutrino RTOS 8.0 Starter Kit (aarch64le)
# BCM Status: Reserved — Pending User Approval (NO BCM / HEADER PIN NUMBERS ASSIGNED)
# ==============================================================================

# Node Identity & Network Configuration
nodeId=INT_2
role=TRAFFIC_NODE
ipAddress=192.168.1.102
listenPort=9002
coordinatorIp=192.168.1.100
coordinatorPort=9000
heartbeatIntervalMs=1000
connectTimeoutMs=3000
ackTimeoutMs=3000
watchdogTimeoutMs=5000

# ==============================================================================
# SYMBOLIC GPIO RESERVATIONS (PENDING USER APPROVAL)
# Hardware: 4-Channel Relay Board + 2 Traffic Light Modules + Dual IR Sensors
# Under Phase 14 Absolute Engineering Rules, BCM pin numbers are NOT assigned.
# ==============================================================================

# --- Road A Traffic Light Signals (Top Approach - Primary Corridor) ---

# Symbolic Signal: INT2_ROAD_A_RED
# Purpose: Top Approach Stop Signal Lamp (4-Channel Relay K1)
# Direction: OUTPUT | Polarity: ACTIVE_LOW (Optocoupled Relay Input)
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.INT2_ROAD_A_RED.direction=OUTPUT
signal.INT2_ROAD_A_RED.polarity=ACTIVE_LOW
signal.INT2_ROAD_A_RED.allocation=RESERVED_PENDING_APPROVAL
signal.INT2_ROAD_A_RED.relayChannel=RELAY_CH1
signal.INT2_ROAD_A_RED.description=Intersection 2 Road A Red Lamp (Relay K1)

# Symbolic Signal: INT2_ROAD_A_YELLOW
# Purpose: Top Approach Caution Signal Lamp (4-Channel Relay K2)
# Direction: OUTPUT | Polarity: ACTIVE_LOW (Optocoupled Relay Input)
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.INT2_ROAD_A_YELLOW.direction=OUTPUT
signal.INT2_ROAD_A_YELLOW.polarity=ACTIVE_LOW
signal.INT2_ROAD_A_YELLOW.allocation=RESERVED_PENDING_APPROVAL
signal.INT2_ROAD_A_YELLOW.relayChannel=RELAY_CH2
signal.INT2_ROAD_A_YELLOW.description=Intersection 2 Road A Yellow Lamp (Relay K2)

# Symbolic Signal: INT2_ROAD_A_GREEN
# Purpose: Top Approach Priority Green Lamp (4-Channel Relay K3)
# Direction: OUTPUT | Polarity: ACTIVE_LOW (Optocoupled Relay Input)
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.INT2_ROAD_A_GREEN.direction=OUTPUT
signal.INT2_ROAD_A_GREEN.polarity=ACTIVE_LOW
signal.INT2_ROAD_A_GREEN.allocation=RESERVED_PENDING_APPROVAL
signal.INT2_ROAD_A_GREEN.relayChannel=RELAY_CH3
signal.INT2_ROAD_A_GREEN.description=Intersection 2 Road A Green Lamp (Relay K3)

# --- Road B Traffic Light Signals (Right Approach - Cross Traffic / Secondary Amb) ---

# Symbolic Signal: INT2_ROAD_B_RED
# Purpose: Right Approach Stop Signal Lamp (Interlocked via K3 NC contact or Expansion)
# Direction: OUTPUT | Polarity: ACTIVE_HIGH
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.INT2_ROAD_B_RED.direction=OUTPUT
signal.INT2_ROAD_B_RED.polarity=ACTIVE_HIGH
signal.INT2_ROAD_B_RED.allocation=RESERVED_PENDING_APPROVAL
signal.INT2_ROAD_B_RED.description=Intersection 2 Road B Red Lamp (Interlocked/Expansion)

# Symbolic Signal: INT2_ROAD_B_YELLOW
# Purpose: Right Approach Caution Signal Lamp (Direct Drive / Expansion)
# Direction: OUTPUT | Polarity: ACTIVE_HIGH
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.INT2_ROAD_B_YELLOW.direction=OUTPUT
signal.INT2_ROAD_B_YELLOW.polarity=ACTIVE_HIGH
signal.INT2_ROAD_B_YELLOW.allocation=RESERVED_PENDING_APPROVAL
signal.INT2_ROAD_B_YELLOW.description=Intersection 2 Road B Yellow Lamp (Expansion)

# Symbolic Signal: INT2_ROAD_B_GREEN
# Purpose: Right Approach Green Lamp (4-Channel Relay K4)
# Direction: OUTPUT | Polarity: ACTIVE_LOW (Optocoupled Relay Input)
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.INT2_ROAD_B_GREEN.direction=OUTPUT
signal.INT2_ROAD_B_GREEN.polarity=ACTIVE_LOW
signal.INT2_ROAD_B_GREEN.allocation=RESERVED_PENDING_APPROVAL
