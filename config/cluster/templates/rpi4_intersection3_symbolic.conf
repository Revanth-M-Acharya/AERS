# ==============================================================================
# SMART AEGIS - Phase 14 Hardware Configuration Template (SYMBOLIC RESERVATION)
# Node: Raspberry Pi 4 (Traffic Node 3 - Intersection 3: Hospital Terminal Access)
# OS Target: QNX Neutrino RTOS 8.0 Starter Kit (aarch64le)
# Hardware Specification: Direct GPIO LED Control - ONE LED ONLY (Hardware Shortage)
# ==============================================================================

# Node Identity & Network Configuration
nodeId=INT_3
role=TRAFFIC_NODE
ipAddress=192.168.1.103
listenPort=9003
coordinatorIp=192.168.1.100
coordinatorPort=9000
heartbeatIntervalMs=1000
connectTimeoutMs=3000
ackTimeoutMs=3000
watchdogTimeoutMs=5000

# ==============================================================================
# SYMBOLIC GPIO RESERVATIONS (INTERSECTION 3 - EXACTLY ONE LED: BLUE ONLY)
# Due to prototype hardware shortage, Intersection 3 has NO Red LED.
# Direct Raspberry Pi GPIO Control (3.3V Logic, Active-High, 330 Ohm Resistors)
# ==============================================================================

# Symbolic Signal: LED_BLUE
# Purpose: Green wave corridor indicator lamp (Emergency path granted)
# Direction: OUTPUT | Polarity: ACTIVE_HIGH
signal.LED_BLUE.direction=OUTPUT
signal.LED_BLUE.polarity=ACTIVE_HIGH
signal.LED_BLUE.allocation=RESERVED_PENDING_APPROVAL
signal.LED_BLUE.description=Intersection 3 Emergency Corridor Blue LED (330 Ohm Current Limiter)

# Symbolic Signal: INT3_APPROACH_IR
# Purpose: Vehicle detection optical sensor (Hospital approach tracking)
# Direction: INPUT | Polarity: ACTIVE_LOW (LM393 Open-Collector with Pull-Up)
signal.INT3_APPROACH_IR.direction=INPUT
signal.INT3_APPROACH_IR.polarity=ACTIVE_LOW
signal.INT3_APPROACH_IR.allocation=RESERVED_PENDING_APPROVAL
signal.INT3_APPROACH_IR.description=Intersection 3 Hospital Arrival Optical Sensor
