# ==============================================================================
# SMART AEGIS - Phase 14 Hardware Configuration Template (SYMBOLIC RESERVATION)
# Node: Raspberry Pi 1 (Emergency Coordinator Node)
# OS Target: QNX Neutrino RTOS 8.0 Starter Kit (aarch64le)
# BCM Status: Reserved — Pending User Approval (NO BCM / HEADER PIN NUMBERS ASSIGNED)
# ==============================================================================

# Node Identity & Network Configuration
nodeId=RPI_COORD
role=COORDINATOR
ipAddress=192.168.1.100
listenPort=9000
coordinatorIp=192.168.1.100
coordinatorPort=9000
heartbeatIntervalMs=1000
connectTimeoutMs=3000
ackTimeoutMs=3000
watchdogTimeoutMs=5000

# ==============================================================================
# SYMBOLIC GPIO RESERVATIONS (PENDING USER APPROVAL)
# Under Phase 14 Absolute Engineering Rules, BCM pin numbers are NOT assigned.
# All pins remain strictly symbolic until formal allocation review.
# ==============================================================================

# Symbolic Signal: HOME_EMERGENCY_SWITCH
# Purpose: Physical mission trigger push button located at HOME station
# Direction: INPUT | Polarity: ACTIVE_LOW (Internal Pull-Up enabled)
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.HOME_EMERGENCY_SWITCH.direction=INPUT
signal.HOME_EMERGENCY_SWITCH.polarity=ACTIVE_LOW
signal.HOME_EMERGENCY_SWITCH.allocation=RESERVED_PENDING_APPROVAL
signal.HOME_EMERGENCY_SWITCH.description=Emergency Mission Trigger Switch near HOME

# Symbolic Signal: POLICE_OVERRIDE_SWITCH
# Purpose: Verified road obstruction input (Triggers Dynamic Replanning)
# Direction: INPUT | Polarity: ACTIVE_LOW (Internal Pull-Up enabled)
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.POLICE_OVERRIDE_SWITCH.direction=INPUT
signal.POLICE_OVERRIDE_SWITCH.polarity=ACTIVE_LOW
signal.POLICE_OVERRIDE_SWITCH.allocation=RESERVED_PENDING_APPROVAL
signal.POLICE_OVERRIDE_SWITCH.description=Police Verified Road Incident Advisory Switch

# Symbolic Signal: HOME_BUZZER
# Purpose: Acoustic preemption pattern transducer (5 demonstration rhythms)
# Direction: OUTPUT | Polarity: ACTIVE_HIGH (Buffer/Transistor driven)
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.HOME_BUZZER.direction=OUTPUT
signal.HOME_BUZZER.polarity=ACTIVE_HIGH
signal.HOME_BUZZER.allocation=RESERVED_PENDING_APPROVAL
signal.HOME_BUZZER.description=Acoustic Preemption Buzzer at HOME

# Symbolic Signal: COORDINATOR_STATUS_LED
# Purpose: Coordinator microkernel heartbeat & system health indicator
# Direction: OUTPUT | Polarity: ACTIVE_HIGH
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.COORDINATOR_STATUS_LED.direction=OUTPUT
signal.COORDINATOR_STATUS_LED.polarity=ACTIVE_HIGH
signal.COORDINATOR_STATUS_LED.allocation=RESERVED_PENDING_APPROVAL
signal.COORDINATOR_STATUS_LED.description=Coordinator System Liveness Heartbeat LED

# Symbolic Bus: V2X_OLED_I2C
# Purpose: Vehicle-to-Everything 0.96 inch SSD1306 Visual Advisory Display
# Sub-signals: V2X_OLED_SDA, V2X_OLED_SCL
# Standard: I2C-1 Bus (3.3V LVTTL, Open-Drain with on-board pull-up)
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.V2X_OLED_SDA.bus=I2C1_DATA
signal.V2X_OLED_SDA.allocation=RESERVED_PENDING_APPROVAL
signal.V2X_OLED_SCL.bus=I2C1_CLOCK
signal.V2X_OLED_SCL.allocation=RESERVED_PENDING_APPROVAL
