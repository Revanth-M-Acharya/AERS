# ==============================================================================
# SMART AEGIS - Phase 14 Hardware Configuration Template (SYMBOLIC RESERVATION)
# Node: Raspberry Pi 2 (Traffic Node 1 - Intersection 1)
# OS Target: QNX Neutrino RTOS 8.0 Starter Kit (aarch64le)
# Hardware Specification: Direct GPIO LED Control (TWO LEDs: Red & Blue)
# ==============================================================================

# Node Identity & Network Configuration
nodeId=INT_1
role=TRAFFIC_NODE
ipAddress=192.168.1.101
listenPort=9001
coordinatorIp=192.168.1.100
coordinatorPort=9000
heartbeatIntervalMs=1000
connectTimeoutMs=3000
ackTimeoutMs=3000
watchdogTimeoutMs=5000

# ==============================================================================
# SYMBOLIC GPIO RESERVATIONS (INTERSECTION 1 - EXACTLY TWO LEDS)
# Direct Raspberry Pi GPIO Control (3.3V Logic, Active-High, 330 Ohm Resistors)
# ==============================================================================

# Symbolic Signal: LED_RED
# Purpose: Stop indicator lamp (Hold non-corridor traffic)
# Direction: OUTPUT | Polarity: ACTIVE_HIGH
signal.LED_RED.direction=OUTPUT
signal.LED_RED.polarity=ACTIVE_HIGH
signal.LED_RED.allocation=RESERVED_PENDING_APPROVAL
signal.LED_RED.description=Intersection 1 Stop Red LED (330 Ohm Current Limiter)

# Symbolic Signal: LED_BLUE
# Purpose: Green wave corridor indicator lamp (Emergency path granted)
# Direction: OUTPUT | Polarity: ACTIVE_HIGH
signal.LED_BLUE.direction=OUTPUT
signal.LED_BLUE.polarity=ACTIVE_HIGH
signal.LED_BLUE.allocation=RESERVED_PENDING_APPROVAL
signal.LED_BLUE.description=Intersection 1 Emergency Corridor Blue LED (330 Ohm Current Limiter)

# Symbolic Signal: INT1_APPROACH_IR
# Purpose: Vehicle detection optical sensor (Active approach tracking)
# Direction: INPUT | Polarity: ACTIVE_LOW (LM393 Open-Collector with Pull-Up)
signal.INT1_APPROACH_IR.direction=INPUT
signal.INT1_APPROACH_IR.polarity=ACTIVE_LOW
signal.INT1_APPROACH_IR.allocation=RESERVED_PENDING_APPROVAL
signal.INT1_APPROACH_IR.description=Intersection 1 Optical Vehicle Approach Sensor
