# ==============================================================================
# SMART AEGIS - Phase 14 Hardware Configuration Template (SYMBOLIC RESERVATION)
# Node: Raspberry Pi 2 (Traffic Node 1 - Intersection 1)
# OS Target: QNX Neutrino RTOS 8.0 Starter Kit (aarch64le)
# BCM Status: Reserved — Pending User Approval (NO BCM / HEADER PIN NUMBERS ASSIGNED)
# ==============================================================================

# Node Identity & Network Configuration
nodeId=INT_1
role=TRAFFIC_NODE
ipAddress=192.168.1.101
listenPort=9001
coordinatorIp=192.168.1.100
coordinatorPort=9000
heartbeatIntervalMs=1000
connectTimeoutMs=3000
ackTimeoutMs=3000
watchdogTimeoutMs=5000

# ==============================================================================
# SYMBOLIC GPIO RESERVATIONS (PENDING USER APPROVAL)
# Hardware: 4-Channel Relay Board + 2 Traffic Light Modules (Road A & Road B)
# Under Phase 14 Absolute Engineering Rules, BCM pin numbers are NOT assigned.
# ==============================================================================

# --- Road A Traffic Light Signals (Corridor Primary Approach) ---

# Symbolic Signal: INT1_ROAD_A_RED
# Purpose: Road A Stop Signal Lamp (4-Channel Relay K1)
# Direction: OUTPUT | Polarity: ACTIVE_LOW (Optocoupled Relay Input)
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.INT1_ROAD_A_RED.direction=OUTPUT
signal.INT1_ROAD_A_RED.polarity=ACTIVE_LOW
signal.INT1_ROAD_A_RED.allocation=RESERVED_PENDING_APPROVAL
signal.INT1_ROAD_A_RED.relayChannel=RELAY_CH1
signal.INT1_ROAD_A_RED.description=Intersection 1 Road A Red Lamp (Relay K1)

# Symbolic Signal: INT1_ROAD_A_YELLOW
# Purpose: Road A Caution / Transition Signal Lamp (4-Channel Relay K2)
# Direction: OUTPUT | Polarity: ACTIVE_LOW (Optocoupled Relay Input)
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.INT1_ROAD_A_YELLOW.direction=OUTPUT
signal.INT1_ROAD_A_YELLOW.polarity=ACTIVE_LOW
signal.INT1_ROAD_A_YELLOW.allocation=RESERVED_PENDING_APPROVAL
signal.INT1_ROAD_A_YELLOW.relayChannel=RELAY_CH2
signal.INT1_ROAD_A_YELLOW.description=Intersection 1 Road A Yellow Lamp (Relay K2)

# Symbolic Signal: INT1_ROAD_A_GREEN
# Purpose: Road A Emergency Preemption Green Lamp (4-Channel Relay K3)
# Direction: OUTPUT | Polarity: ACTIVE_LOW (Optocoupled Relay Input)
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.INT1_ROAD_A_GREEN.direction=OUTPUT
signal.INT1_ROAD_A_GREEN.polarity=ACTIVE_LOW
signal.INT1_ROAD_A_GREEN.allocation=RESERVED_PENDING_APPROVAL
signal.INT1_ROAD_A_GREEN.relayChannel=RELAY_CH3
signal.INT1_ROAD_A_GREEN.description=Intersection 1 Road A Green Lamp (Relay K3)

# --- Road B Traffic Light Signals (Cross Traffic Approach) ---

# Symbolic Signal: INT1_ROAD_B_RED
# Purpose: Road B Stop Signal Lamp (Interlocked via K3 NC contact or Secondary Expansion)
# Direction: OUTPUT | Polarity: ACTIVE_HIGH
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.INT1_ROAD_B_RED.direction=OUTPUT
signal.INT1_ROAD_B_RED.polarity=ACTIVE_HIGH
signal.INT1_ROAD_B_RED.allocation=RESERVED_PENDING_APPROVAL
signal.INT1_ROAD_B_RED.description=Intersection 1 Road B Red Lamp (Interlocked/Expansion)

# Symbolic Signal: INT1_ROAD_B_YELLOW
# Purpose: Road B Caution Signal Lamp (Direct Drive / Secondary Expansion)
# Direction: OUTPUT | Polarity: ACTIVE_HIGH
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.INT1_ROAD_B_YELLOW.direction=OUTPUT
signal.INT1_ROAD_B_YELLOW.polarity=ACTIVE_HIGH
signal.INT1_ROAD_B_YELLOW.allocation=RESERVED_PENDING_APPROVAL
signal.INT1_ROAD_B_YELLOW.description=Intersection 1 Road B Yellow Lamp (Expansion)

# Symbolic Signal: INT1_ROAD_B_GREEN
# Purpose: Road B Normal Flow Green Lamp (4-Channel Relay K4)
# Direction: OUTPUT | Polarity: ACTIVE_LOW (Optocoupled Relay Input)
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.INT1_ROAD_B_GREEN.direction=OUTPUT
signal.INT1_ROAD_B_GREEN.polarity=ACTIVE_LOW
signal.INT1_ROAD_B_GREEN.allocation=RESERVED_PENDING_APPROVAL
signal.INT1_ROAD_B_GREEN.relayChannel=RELAY_CH4
signal.INT1_ROAD_B_GREEN.description=Intersection 1 Road B Green Lamp (Relay K4)

# --- Optical Sensor Signals ---

# Symbolic Signal: INT1_IR_SENSOR
# Purpose: Optical vehicle approach detection sensor (Active-low beam interrupted)
# Direction: INPUT | Polarity: ACTIVE_LOW (Debounce window: 30ms)
# BCM Allocation: Reserved — Pending User Approval
# Header Pin: Reserved — Pending User Approval
signal.INT1_IR_SENSOR.direction=INPUT
signal.INT1_IR_SENSOR.polarity=ACTIVE_LOW
signal.INT1_IR_SENSOR.allocation=RESERVED_PENDING_APPROVAL
signal.INT1_IR_SENSOR.description=Intersection 1 Optical Vehicle Approach IR Sensor
