# ==============================================================================
# SMART AEGIS - Phase 12 Physical Hardware Demonstration Configuration
# Target: 4x Raspberry Pi 4 Model B (QNX Neutrino RTOS 8.0 aarch64le)
# Road Layout: HOME -> Intersection 1 -> Intersection 2 -> Intersection 3 -> HOSPITAL
# ==============================================================================

# ------------------------------------------------------------------------------
# RPi 1: Emergency Coordinator Node (192.168.1.100:9000)
# ------------------------------------------------------------------------------
coordinator.nodeId=RPI_COORD
coordinator.role=COORDINATOR
coordinator.ipAddress=192.168.1.100
coordinator.listenPort=9000

# Coordinator Controls & Feedback
pin.COORDINATOR_BUZZER=6,OUTPUT,ACTIVE_HIGH,Acoustic Preemption Buzzer
pin.EMERGENCY_SWITCH=23,INPUT,ACTIVE_LOW,Emergency Mission Trigger Switch near HOME
pin.POLICE_OVERRIDE_SWITCH=24,INPUT,ACTIVE_LOW,Police Barricade / Road Closed Switch
pin.STATUS_LED=18,OUTPUT,ACTIVE_HIGH,Coordinator Heartbeat/Status LED
# OLED Display: Uses I2C-1 bus (SDA: BCM GPIO 2, SCL: BCM GPIO 3)

# ------------------------------------------------------------------------------
# RPi 2: Traffic Node 1 (Intersection 1) (192.168.1.101:9001)
# ------------------------------------------------------------------------------
node1.nodeId=INT_1
node1.role=TRAFFIC_NODE
node1.ipAddress=192.168.1.101
node1.listenPort=9001

# Road A Traffic Lights (Corridor Direct Flow)
pin.INT1_ROAD_A_RED=17,OUTPUT,ACTIVE_LOW,Relay Ch 1 (Road A Red Lamp)
pin.INT1_ROAD_A_YELLOW=27,OUTPUT,ACTIVE_LOW,Relay Ch 2 (Road A Yellow Lamp)
pin.INT1_ROAD_A_GREEN=22,OUTPUT,ACTIVE_LOW,Relay Ch 3 (Road A Green Lamp)

# Road B Traffic Lights (Cross Traffic Flow)
pin.INT1_ROAD_B_RED=23,OUTPUT,ACTIVE_HIGH,Direct Drive (Road B Red Lamp)
pin.INT1_ROAD_B_YELLOW=24,OUTPUT,ACTIVE_HIGH,Direct Drive (Road B Yellow Lamp)
pin.INT1_ROAD_B_GREEN=25,OUTPUT,ACTIVE_LOW,Relay Ch 4 (Road B Green Lamp)

# Vehicle Detection IR Sensor
pin.INT1_APPROACH_IR=12,INPUT,ACTIVE_LOW,Active Optical Approach IR Sensor

# ------------------------------------------------------------------------------
# RPi 3: Traffic Node 2 (Intersection 2 - Priority Scheduling Hub) (192.168.1.102:9002)
# ------------------------------------------------------------------------------
node2.nodeId=INT_2
node2.role=TRAFFIC_NODE
node2.ipAddress=192.168.1.102
node2.listenPort=9002

# Road A Traffic Lights (Top Approach Flow)
pin.INT2_ROAD_A_RED=5,OUTPUT,ACTIVE_LOW,Relay Ch 1 (Road A Red Lamp)
pin.INT2_ROAD_A_YELLOW=6,OUTPUT,ACTIVE_LOW,Relay Ch 2 (Road A Yellow Lamp)
pin.INT2_ROAD_A_GREEN=13,OUTPUT,ACTIVE_LOW,Relay Ch 3 (Road A Green Lamp)

# Road B Traffic Lights (Right Approach Flow)
pin.INT2_ROAD_B_RED=19,OUTPUT,ACTIVE_HIGH,Direct Drive (Road B Red Lamp)
pin.INT2_ROAD_B_YELLOW=26,OUTPUT,ACTIVE_HIGH,Direct Drive (Road B Yellow Lamp)
pin.INT2_ROAD_B_GREEN=16,OUTPUT,ACTIVE_LOW,Relay Ch 4 (Road B Green Lamp)

# Dual Vehicle Detection IR Sensors for Priority Demonstration
pin.INT2_APPROACH_IR_TOP=20,INPUT,ACTIVE_LOW,Optical IR Sensor Approach A (Top Approach)
pin.INT2_APPROACH_IR_RIGHT=21,INPUT,ACTIVE_LOW,Optical IR Sensor Approach B (Right Approach)

# ------------------------------------------------------------------------------
# RPi 4: Traffic Node 3 (Intersection 3) (192.168.1.103:9003)
# ------------------------------------------------------------------------------
node3.nodeId=INT_3
node3.role=TRAFFIC_NODE
node3.ipAddress=192.168.1.103
node3.listenPort=9003

# Road A Traffic Lights (Corridor Direct Flow)
pin.INT3_ROAD_A_RED=7,OUTPUT,ACTIVE_LOW,Relay Ch 1 (Road A Red Lamp)
pin.INT3_ROAD_A_YELLOW=8,OUTPUT,ACTIVE_LOW,Relay Ch 2 (Road A Yellow Lamp)
pin.INT3_ROAD_A_GREEN=11,OUTPUT,ACTIVE_LOW,Relay Ch 3 (Road A Green Lamp)

# Road B Traffic Lights (Cross Traffic Flow)
pin.INT3_ROAD_B_RED=9,OUTPUT,ACTIVE_HIGH,Direct Drive (Road B Red Lamp)
pin.INT3_ROAD_B_YELLOW=10,OUTPUT,ACTIVE_HIGH,Direct Drive (Road B Yellow Lamp)
pin.INT3_ROAD_B_GREEN=25,OUTPUT,ACTIVE_LOW,Relay Ch 4 (Road B Green Lamp)

# Vehicle Detection IR Sensor
pin.INT3_APPROACH_IR=18,INPUT,ACTIVE_LOW,Active Optical Approach IR Sensor
