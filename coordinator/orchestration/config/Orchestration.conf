# ==============================================================================
# SMART AEGIS (AERS) — Coordinator Orchestration Configuration
# Target: Raspberry Pi 4 Model B (QNX SDP 8.0 / POSIX)
# ==============================================================================

# Heartbeat timeout threshold in milliseconds before node is marked OFFLINE
HeartbeatTimeoutMs=5000

# Maximum dispatch retry attempts for unacknowledged stage commands
RetryCount=3

# Delay in milliseconds between dispatch retry attempts
RetryDelayMs=500

# Timeout in milliseconds for receiving stage execution ACK
DispatchTimeoutMs=2000

# Clock drift threshold in milliseconds triggering resynchronization alert
ClockDriftThresholdMs=500

# Maximum allowed node network round-trip delay in milliseconds
MaxNodeDelayMs=3000

# Timeout in milliseconds for failover corridor recovery recomputation
RecoveryTimeoutMs=4000

# Coordinator FSM state execution watchdog timeout in milliseconds
FsmTimeoutMs=10000

# Event bus bounded event queue capacity
EventQueueSize=256

# Coordinator internal worker thread pool size
ThreadPoolSize=4

