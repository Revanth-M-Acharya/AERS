# ==============================================================================
# SMART AEGIS - Traffic Signal Node Configuration
# Target: Raspberry Pi 4 Model B (QNX SDP 8.0 / aarch64le)
# ==============================================================================

# Node Identification (INT_A, INT_B, or INT_C)
NodeID = INT_A

# Coordinator TCP Server Connection (Static Wi-Fi)
CoordinatorIP = 127.0.0.1
CoordinatorPort = 8080
ConnectTimeout = 3000

# Resilience & Recovery Timings (Milliseconds)
HeartbeatInterval = 1000
HeartbeatTimeout = 5000
ReconnectDelay = 2000
WatchdogTimeout = 5000

# 4-Channel Relay Module Pin Mapping (BCM GPIO on Raspberry Pi 4)
RelayPinRed = 17
RelayPinYellow = 27
RelayPinGreen = 22
RelayPinAux = 23
RelayDelay = 50

# Autonomous Normal Mode Timing (Milliseconds)
GreenDuration = 10000
YellowDuration = 3000
RedDuration = 10000
AllRedDuration = 1000

# Structured Logging
LogLevel = INFO
LogFile = traffic_node.log
LogToConsole = 1

